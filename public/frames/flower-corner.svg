<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
<!-- Green leaves -->
<path d="M20 160 Q 60 140, 80 100 Q 100 60, 140 40" stroke="#7a9e7e" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M80 100 Q 90 80, 110 70" stroke="#7a9e7e" stroke-width="2" fill="#a8c8a8" opacity="0.8"/>
<path d="M120 60 Q 130 40, 150 30" stroke="#7a9e7e" stroke-width="2" fill="#a8c8a8" opacity="0.8"/>
<!-- Small pink flower top left -->
<g transform="translate(30,40)">
<ellipse cx="0" cy="0" rx="18" ry="22" fill="#f8b5d0" stroke="#e8a0b8" stroke-width="1"/>
<ellipse cx="-12" cy="-8" rx="14" ry="18" fill="#f8b5d0" stroke="#e8a0b8" stroke-width="1"/>
<ellipse cx="12" cy="-8" rx="14" ry="18" fill="#f8b5d0" stroke="#e8a0b8" stroke-width="1"/>
<ellipse cx="-8" cy="12" rx="12" ry="16" fill="#f8b5d0" stroke="#e8a0b8" stroke-width="1"/>
<ellipse cx="8" cy="12" rx="12" ry="16" fill="#f8b5d0" stroke="#e8a0b8" stroke-width="1"/>
<circle cx="0" cy="0" r="6" fill="#a8e6cf"/>
</g>
<!-- Large pink-purple flower -->
<g transform="translate(120,110)">
<ellipse cx="0" cy="0" rx="45" ry="55" fill="#d8a0c8" stroke="#c080a0" stroke-width="1.5"/>
<ellipse cx="-20" cy="-15" rx="30" ry="40" fill="#e8b0d0" stroke="#d090b0" stroke-width="1"/>
<ellipse cx="20" cy="-15" rx="30" ry="40" fill="#e8b0d0" stroke="#d090b0" stroke-width="1"/>
<ellipse cx="-15" cy="20" rx="25" ry="35" fill="#d8a0c8" stroke="#c080a0" stroke-width="1"/>
<ellipse cx="15" cy="20" rx="25" ry="35" fill="#d8a0c8" stroke="#c080a0" stroke-width="1"/>
<path d="M-8 -25 Q 0 -40, 8 -25" stroke="#7a9e7e" stroke-width="1.5" fill="none"/>
<circle cx="0" cy="-8" r="8" fill="#fff" opacity="0.9"/>
<circle cx="0" cy="-8" r="4" fill="#f0c040"/>
</g>
<!-- Purple top flower -->
<g transform="translate(90,20)">
<ellipse cx="0" cy="0" rx="18" ry="22" fill="#a080c0" stroke="#8060a0" stroke-width="1"/>
<ellipse cx="-10" cy="-5" rx="12" ry="16" fill="#a080c0" stroke="#8060a0" stroke-width="1"/>
<ellipse cx="10" cy="-5" rx="12" ry="16" fill="#b090d0" stroke="#8060a0" stroke-width="1"/>
<circle cx="0" cy="2" r="5" fill="#fff"/>
</g>
</svg>